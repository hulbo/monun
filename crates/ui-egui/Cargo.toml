[package]
name = "monun-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Monun egui frontend (Excel-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[features]
default = ["pdf", "word", "hwp", "slides", "api"]
# PDF files shown in their tab (desktop; the web build says it can't show them).
pdf = ["dep:pdfcraft-render", "dep:hayro"]
# Word files shown and edited in their tab (desktop; the web build says it can't show them).
word = ["dep:wordcraft-engine", "dep:wordcraft-layout", "dep:wordcraft-render", "dep:wordcraft-pdf", "dep:wordcraft-doc", "dep:wordcraft-fonts"]
# 한글 files (.hwp/.hwpx) shown and edited in their tab (desktop; the web build says it can't show them).
hwp = ["dep:rhwp", "dep:resvg", "dep:lopdf"]
# PowerPoint presentations shown in their tab, as a web page of their slides (desktop; the web build
# says it can't show them).
slides = ["dep:monun-pptx"]
# API requests (.http files) sent from their tab (desktop; the web build says it needs the desktop app).
api = ["dep:ureq", "dep:sha2"]
# Mermaid blocks of document tabs drawn as diagrams (desktop; the web build shows them as code).
diagrams = ["monun-markdown/diagrams", "monun-engine/diagrams"]

[dependencies]
# The shared capture slot (`craft_ui::capture`) comes from the one craft-libs revision every
# craft-libs dependency uses (see the root Cargo.toml).
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
monun-engine = { workspace = true }
monun-markdown = { workspace = true }
monun-chart = { workspace = true }
# `monochrome_emoji_fonts` restores the Noto Emoji and emoji-icon faces that 0.37 moved behind
# this feature. The UI draws ✕, ◀, ↘ and 📋 as text; without these faces the strict kittest
# harness (and a host with no symbol font) renders them as tofu.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
image = { workspace = true }
skrifa = { workspace = true }
web-time = { workspace = true }
pdfcraft-render = { workspace = true, optional = true }
hayro = { workspace = true, optional = true }
wordcraft-engine = { workspace = true, optional = true }
wordcraft-layout = { workspace = true, optional = true }
wordcraft-render = { workspace = true, optional = true }
wordcraft-pdf = { workspace = true, optional = true }
wordcraft-doc = { workspace = true, optional = true }
wordcraft-fonts = { workspace = true, optional = true }
rhwp = { workspace = true, optional = true }
monun-pptx = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }
lopdf = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

# Linux only, where winit reports no system theme: the desktop portal's light/dark answer (see
# `desktop_theme.rs`). Already in the tree, with these features, through egui's own
# accessibility bus; pinned to one version so nothing is built twice.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
epaint_default_fonts = { workspace = true }
monun-xlsx = { workspace = true, features = ["test-support"] }
# Presentations made in tests (`tests/it/slides_view.rs`).
zip = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The desktop's preferred language for the first-run interface language.
sys-locale = { workspace = true }
craft-window = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Read the browser's preferred language for the first-run web interface language.
web-sys = { version = "0.3", features = ["Window", "Navigator", "Performance"] }
