[package]
name = "monun-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Monun engine: sessions, commands, history, clipboard, fill, sort, filter"

[lints]
workspace = true

[features]
# Mermaid diagrams of document tabs drawn in printouts and PDFs (native builds).
diagrams = ["monun-markdown/diagrams"]

[dependencies]
monun-core = { workspace = true }
monun-numfmt = { workspace = true }
monun-formula = { workspace = true }
monun-functions = { workspace = true }
monun-model = { workspace = true }
monun-calc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
web-time = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
monun-xlsx = { workspace = true }
monun-chart = { workspace = true }
monun-pdf = { workspace = true }
monun-markdown = { workspace = true }
image = { workspace = true }

[dev-dependencies]
monun-xlsx = { workspace = true, features = ["test-support"] }
zip = { workspace = true }
encoding_rs = { workspace = true }
