[package]
name = "monun-markdown"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Monun document tabs: Markdown parsed into blocks for the preview, with source lines and task offsets"

[lints]
workspace = true

[features]
# Mermaid diagrams drawn to pixels (`diagram`); native builds only.
diagrams = ["dep:mermaid-rs-renderer", "dep:resvg"]

[dependencies]
pulldown-cmark = { workspace = true }
mermaid-rs-renderer = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }
