[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/monun", "apps/monun-cli", "xtask"]

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/hulbo/monun"

[workspace.dependencies]
# internal
monun-core = { path = "crates/core" }
monun-numfmt = { path = "crates/numfmt" }
monun-formula = { path = "crates/formula" }
monun-functions = { path = "crates/functions" }
monun-model = { path = "crates/model" }
monun-calc = { path = "crates/calc" }
monun-xlsx = { path = "crates/xlsx" }
monun-chart = { path = "crates/chart" }
monun-markdown = { path = "crates/markdown" }
monun-engine = { path = "crates/engine" }
# Features chosen by each app: the desktop turns on `diagrams` and `pdf`, the web build neither.
monun-ui-egui = { path = "crates/ui-egui", default-features = false }
monun-mcp = { path = "crates/mcp" }
monun-pdf = { path = "crates/pdf" }
# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
web-time = "1.1.0"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
quick-xml = "0.41"
# Markdown of document tabs: the parser only, no HTML output.
pulldown-cmark = { version = "0.13", default-features = false }
# Mermaid diagrams of document tabs (desktop only): layout into SVG, then pixels with the system
# fonts. The renderer is young, so it is pinned exactly: review its diff before bumping.
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
zip = { version = "3", default-features = false, features = ["deflate"] }
sha2 = { version = "0.11", default-features = false }
# Decrypting password-protected workbooks ([MS-OFFCRYPTO]): AES and SHA-1, pure Rust (wasm-safe).
aes = { version = "0.9", default-features = false }
sha1 = { version = "0.11", default-features = false }
# Korean code page 949 CSV and text files (read and written back as they came), pure Rust (wasm-safe).
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# PDF viewing (desktop): PdfCraft's renderer (page rasters on a pool of threads, the text layer
# for find and copy, bookmarks), from one reviewed PdfCraft commit. It is built on PdfCraft's
# patched hayro stack, patched in below: crates.io hayro has no cancellation or render-into.
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft.git", rev = "8c99ec4e084a02af89ab9b20f5502be15ca04a47" }
# The parser alone, to lay out a PDF's pages before the first raster (the patched one, below).
hayro = "0.7.1"

# Word files (desktop): WordCraft's engine (.docx read and write, layout, editing commands, undo),
# its page renderer and PDF export, from one reviewed WordCraft commit. Its own interface isn't
# used: the tab is drawn by `crates/ui-egui/src/word_view`. Its Krilla patch is copied below.
wordcraft-engine = { git = "https://github.com/storytold/wordcraft.git", rev = "07f977372d3767e4abf7f3b0cc77c351289013f2" }
wordcraft-layout = { git = "https://github.com/storytold/wordcraft.git", rev = "07f977372d3767e4abf7f3b0cc77c351289013f2" }
wordcraft-render = { git = "https://github.com/storytold/wordcraft.git", rev = "07f977372d3767e4abf7f3b0cc77c351289013f2" }
wordcraft-pdf = { git = "https://github.com/storytold/wordcraft.git", rev = "07f977372d3767e4abf7f3b0cc77c351289013f2" }
wordcraft-doc = { git = "https://github.com/storytold/wordcraft.git", rev = "07f977372d3767e4abf7f3b0cc77c351289013f2" }
wordcraft-fonts = { git = "https://github.com/storytold/wordcraft.git", rev = "07f977372d3767e4abf7f3b0cc77c351289013f2" }

# ui
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }
# The desktop's preferred language, for the first-run interface language (native only).
sys-locale = "0.3"
# Font parser egui's epaint uses; the UI validates system font files with it before handing them
# to egui, which panics on a file it can't parse. Same version as epaint's, so no second copy.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# Real font bytes for tests (Ubuntu Light, compiled into epaint).
epaint_default_fonts = "0.37"
# One native window per workbook: the window list, Window menu titles and the immediate-viewport
# driver. Every craft-libs crate (craft-window here, craft-ui in ui-egui, craft-print in the app)
# comes from this one revision.
craft-window = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0", default-features = false, features = ["egui"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Keep the complete egui family and native event bridge on reviewed fork commits.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

# PdfCraft's patched hayro and vello stack (see pdfcraft-render above): its own `[patch]` doesn't
# reach a workspace that depends on it, so the same crates come from the same commit here.
hayro = { git = "https://github.com/storytold/pdfcraft.git", rev = "8c99ec4e084a02af89ab9b20f5502be15ca04a47" }
hayro-interpret = { git = "https://github.com/storytold/pdfcraft.git", rev = "8c99ec4e084a02af89ab9b20f5502be15ca04a47" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft.git", rev = "8c99ec4e084a02af89ab9b20f5502be15ca04a47" }
hayro-cmap = { git = "https://github.com/storytold/pdfcraft.git", rev = "8c99ec4e084a02af89ab9b20f5502be15ca04a47" }
hayro-postscript = { git = "https://github.com/storytold/pdfcraft.git", rev = "8c99ec4e084a02af89ab9b20f5502be15ca04a47" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft.git", rev = "8c99ec4e084a02af89ab9b20f5502be15ca04a47" }
lopdf = { git = "https://github.com/storytold/pdfcraft.git", rev = "8c99ec4e084a02af89ab9b20f5502be15ca04a47" }
vello_common = { git = "https://github.com/storytold/pdfcraft.git", rev = "8c99ec4e084a02af89ab9b20f5502be15ca04a47" }
vello_cpu = { git = "https://github.com/storytold/pdfcraft.git", rev = "8c99ec4e084a02af89ab9b20f5502be15ca04a47" }
# WordCraft's PDF export (wordcraft-pdf, through craft-pdf) needs craft-libs' Krilla, as WordCraft
# patches it: its own `[patch]` doesn't reach a workspace that depends on it.
krilla = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b" }
