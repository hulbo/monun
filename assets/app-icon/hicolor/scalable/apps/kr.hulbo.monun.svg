    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#1f9d55"/>
    <rect x="76" y="76" width="360" height="360" rx="30" fill="#fbfaf5"/>
    <path d="M166 76V436M256 76V436M346 76V436M76 166H436M76 256H436M76 346H436" stroke="#a8dcbc" stroke-width="12" fill="none"/>
    <rect x="166" y="166" width="90" height="90" fill="#1f9d55"/>
    <rect x="166" y="166" width="90" height="90" fill="none" stroke="#0f5c30" stroke-width="14"/>
    <rect x="238" y="238" width="36" height="36" fill="#0f5c30" stroke="#fbfaf5" stroke-width="8"/>
  </g>
</svg>
